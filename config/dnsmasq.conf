# Captive Portal - dnsmasq configuration
# This configuration intercepts DNS queries and redirects unauthorized clients to the portal

# Interface to listen on (guest network interface)
interface=ens192

# Don't read /etc/resolv.conf or other system DNS configuration
no-resolv

# Don't read /etc/hosts
no-hosts

# Upstream DNS servers (used for authorized clients)
# Google DNS
server=8.8.8.8
server=8.8.4.4

# Cloudflare DNS (alternative)
# server=1.1.1.1
# server=1.0.0.1

# Log queries for debugging (comment out in production)
log-queries
log-facility=/var/log/dnsmasq.log

# DNS cache size
cache-size=1000

# Return portal IP for all domains (for unauthorized clients)
# This will be overridden by iptables rules for authorized clients
address=/#/192.168.100.1

# Bind to specific interface only
bind-interfaces

# Don't forward reverse lookups for private IP ranges
bogus-priv

# Don't forward plain names (without a dot or domain part)
domain-needed

# Add local domain
local=/portal.local/
domain=portal.local

# Enable DNSSEC if desired (optional)
# dnssec
# trust-anchor=.,20326,8,2,E06D44B80B8F1D39A95C0B0D7C65D08458E880409BBC683457104237C7F8EC8D

# DHCP is handled by isc-dhcp-server, so dnsmasq only handles DNS
# If you want to use dnsmasq for DHCP instead, uncomment below:
# dhcp-range=192.168.100.10,192.168.100.250,12h
# dhcp-option=option:router,192.168.100.1
# dhcp-option=option:dns-server,192.168.100.1

# Increase DNS port range for better performance
# dns-forward-max=1000

# Don't poll /etc/resolv.conf for changes
no-poll

# Return NXDOMAIN for reverse lookups of private IP ranges
# This prevents unnecessary upstream queries
stop-dns-rebind
