# Captive Portal - nginx configuration
# This configuration serves the captive portal page and handles authorization requests

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Server name - catch all domains
    server_name _;

    # Document root
    root /var/www/captiveportal;
    index index.html;

    # Access and error logs
    access_log /var/log/nginx/captiveportal-access.log;
    error_log /var/log/nginx/captiveportal-error.log;

    # Captive portal detection endpoints
    # Windows
    location /connecttest.txt {
        return 302 http://$host/index.html;
    }
    location /redirect {
        return 302 http://$host/index.html;
    }

    # Apple iOS/macOS
    location /hotspot-detect.html {
        return 302 http://$host/index.html;
    }
    location /library/test/success.html {
        return 302 http://$host/index.html;
    }

    # Android
    location /generate_204 {
        return 302 http://$host/index.html;
    }

    # Firefox
    location /success.txt {
        return 302 http://$host/index.html;
    }

    # Serve the portal page for all requests
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Authorization endpoint - handled by backend script
    location /authorize {
        # Pass to authorization backend
        proxy_pass http://127.0.0.1:5000/authorize;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for real-time response
        proxy_buffering off;
    }

    # Check authorization status
    location /check-auth {
        proxy_pass http://127.0.0.1:5000/check-auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Disable caching for the portal page
    location ~* \.(html|htm)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Enable caching for static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
